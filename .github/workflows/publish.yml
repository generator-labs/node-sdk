name: Publish

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
    - uses: actions/checkout@v7

    - name: Use Node.js 24.x
      uses: actions/setup-node@v7
      with:
        node-version: 24.x
        registry-url: 'https://registry.npmjs.org'
        package-manager-cache: false

    - name: Install dependencies
      run: npm ci

    - name: Publish to npm
      run: npm publish
